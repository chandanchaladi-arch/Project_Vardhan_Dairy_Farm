<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vardhan Dairy">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Vardhan Dairy Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --bg:#F5F2E8;
  --surface:#FFFFFF;
  --sunken:#EAE6D6;
  --line:#DCD6C4;
  --fg:#1E2A22;
  --muted:#6B7A70;
  --accent:#2E7A4D;
  --accent-ink:#FFFFFF;
  --danger:#B4433E;
  --ok:#2E7A4D;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10160F; --surface:#182420; --sunken:#0C1210; --line:#28352F;
    --fg:#E7EFE9; --muted:#8FA39A; --accent:#59B786; --accent-ink:#0C1210;
    --danger:#E2716E; --ok:#59B786;
  }
}
:root[data-theme="dark"]{
  --bg:#10160F; --surface:#182420; --sunken:#0C1210; --line:#28352F;
  --fg:#E7EFE9; --muted:#8FA39A; --accent:#59B786; --accent-ink:#0C1210;
  --danger:#E2716E; --ok:#59B786;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400}
.hidden{display:none !important}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex:none}
.wordmark{font-family:"Instrument Serif",Georgia,serif;font-size:22px;letter-spacing:.01em}
.spacer{flex:1}
.datepill{font-size:12px;color:var(--muted);padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* ---------- content ---------- */
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 100px}

/* ---------- stat cards ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0}
.statgrid.small{padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.card .cv{font-family:"Instrument Serif",Georgia,serif;font-size:22px;line-height:1.15}
.card .cl{font-size:11.5px;color:var(--muted);margin-top:3px}
.card.neg .cv{color:var(--danger)}
.card.pos .cv{color:var(--ok)}

/* ---------- sections ---------- */
.sec{padding:16px 0 4px}
.sec h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
.hint{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.empty-inline{font-size:13.5px;color:var(--muted);padding:10px 0}

/* ---------- month nav ---------- */
.monthnav{display:flex;align-items:center;gap:8px;padding:10px 0 2px}
.iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);flex:none}
.iconbtn:disabled{opacity:.3;cursor:default}
.monthname{font-family:"Instrument Serif",Georgia,serif;font-size:18px;flex:1;text-align:center}

.bigtotal{padding:10px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.bigtotal .v{font-family:"Instrument Serif",Georgia,serif;font-size:34px;line-height:1.05}
.bigtotal .k{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- bars (category breakdown) ---------- */
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:11px}
.brow .n{font-size:13.5px}
.brow .v{font-family:"Instrument Serif",Georgia,serif;font-size:15px;text-align:right}
.brow .bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
.brow .bar i{display:block;height:100%;border-radius:4px}

/* ---------- generic list rows ---------- */
.daylbl{font-size:12px;color:var(--muted);padding:14px 0 6px;position:sticky;top:0;background:var(--bg)}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.mini-row:first-of-type{border-top:0}
.mini-row .v{font-family:"Instrument Serif",Georgia,serif;font-size:15px;flex:none}
.mini-row .v.neg{color:var(--danger)}
.mini-del{font-size:15px;color:var(--muted);padding:0 4px;margin-left:6px}

/* ---------- worker / customer cards ---------- */
.worker-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.worker-card:first-of-type{border-top:0}
.wc-main{flex:1;min-width:0;cursor:pointer}
.wc-name{font-size:14.5px;font-weight:500}
.wc-meta{font-size:12px;color:var(--muted);margin-top:2px}
.wc-att{display:flex;gap:6px;flex:none}
.chip{font-size:12px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.customer-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.customer-card:first-of-type{border-top:0}
.cc-name{font-size:14.5px;font-weight:500}
.cc-meta{font-size:12px;color:var(--muted);margin-top:2px}
.cc-out{font-family:"Instrument Serif",Georgia,serif;font-size:16px;flex:none}
.cc-out.neg{color:var(--danger)}
.ok{color:var(--ok)}
.neg{color:var(--danger)}

.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--sunken);color:var(--muted);margin-left:6px;font-weight:500}

/* ---------- buttons ---------- */
.btn{padding:11px 14px;border-radius:11px;font-size:13.5px;font-weight:600;text-align:center;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.file-btn{cursor:pointer}

/* ---------- forms ---------- */
.form{display:flex;flex-direction:column;gap:11px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.form input,.form select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.form-actions .btn{width:100%}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;z-index:50}
@media (min-width:560px){ .modal-backdrop{align-items:center;justify-content:center} }
.modal{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 18px 26px}
@media (min-width:560px){ .modal{border-radius:18px} }
.modal-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;position:sticky;top:0;background:var(--bg)}
.modal-head h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:19px;margin:0;flex:1}
.modal-close{font-size:20px;color:var(--muted);width:30px;height:30px;display:flex;align-items:center;justify-content:center}

.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.detail-stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.detail-stats .k{display:block;font-size:10.5px;color:var(--muted)}
.detail-stats .v{display:block;font-family:"Instrument Serif",Georgia,serif;font-size:16px;margin-top:2px}
.detail-stats .v.neg{color:var(--danger)}
.detail-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.detail-actions .btn{flex:1;min-width:120px}
.modal-body h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 4px}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;
}
.tabbar-inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:10.5px}
.tab .ic{font-size:18px;line-height:1}
.tab[aria-pressed="true"]{color:var(--accent)}

/* ---------- fab ---------- */
.fab-wrap{position:fixed;right:calc(50% - 260px);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25}
@media (max-width:560px){ .fab-wrap{right:18px} }
.fab{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="wordmark">Vardhan Dairy</span>
    <span class="spacer"></span>
    <span class="datepill" id="today-pill"></span>
  </header>

  <main class="view" id="content"></main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab" data-tab="dashboard" aria-pressed="true"><span class="ic">⌂</span><span>Dashboard</span></button>
      <button class="tab" data-tab="production"><span class="ic">🥛</span><span>Production</span></button>
      <button class="tab" data-tab="customers"><span class="ic">👥</span><span>Customers</span></button>
      <button class="tab" data-tab="workers"><span class="ic">👷</span><span>Workers</span></button>
      <button class="tab" data-tab="expenses"><span class="ic">₹</span><span>Expenses</span></button>
    </div>
  </nav>

  <div class="fab-wrap hidden" id="fab-wrap">
    <button class="fab" data-action="fab-add" aria-label="Add">+</button>
  </div>
</div>

<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-close" data-action="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ================= config ================= */
var LS = "vardhan:";
var EXP_CATS = [
  {id:"feed",     label:"Cattle Feed"},
  {id:"vet",      label:"Veterinary"},
  {id:"medicine", label:"Medicines"},
  {id:"salary",   label:"Worker Salaries"},
  {id:"electricity", label:"Electricity"},
  {id:"water",    label:"Water"},
  {id:"fuel",     label:"Fuel"},
  {id:"transport",label:"Transportation"},
  {id:"maintenance",label:"Maintenance"},
  {id:"equipment",label:"Equipment"},
  {id:"packaging",label:"Packaging"},
  {id:"misc",     label:"Miscellaneous"}
];

/* ================= helpers ================= */
function el(id){ return document.getElementById(id); }
function lsGet(k,fb){ try{ var r=localStorage.getItem(LS+k); return r==null?fb:JSON.parse(r); }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var inr = new Intl.NumberFormat("en-IN",{maximumFractionDigits:2});
function money(n){ n=+n||0; return "₹" + inr.format(Math.round(n*100)/100); }
function trimZeros(s){ return s.replace(/0+$/,"").replace(/\.$/,""); }
function qty(n){ n=Math.round((+n||0)*100)/100; return (Number.isInteger(n) ? String(n) : trimZeros(n.toFixed(2))) + " L"; }

function pad2(n){ return String(n).padStart(2,"0"); }
function toKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return toKey(new Date()); }
function monthKey(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function monthOf(dateKey){ return dateKey.slice(0,7); }
function monthLabel(k){ var p=k.split("-"); var d=new Date(+p[0], +p[1]-1, 1); return d.toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
function shiftMonth(k,by){ var p=k.split("-"); var d=new Date(+p[0], +p[1]-1+by, 1); return monthKey(d); }
function dateLabel(k){
  var t=todayKey(); var y=toKey(new Date(Date.now()-86400000));
  if(k===t) return "Today";
  if(k===y) return "Yesterday";
  var p=k.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
function headerDateLabel(){
  return new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
function catColor(id){
  var idx = EXP_CATS.findIndex(function(c){ return c.id===id; });
  var hue = (idx*151) % 360;
  return "hsl(" + hue + ",55%,45%)";
}
function sumField(arr,field){ return arr.reduce(function(t,i){ return t + (+i[field]||0); },0); }
function inMonth(arr,m){ return arr.filter(function(i){ return monthOf(i.date)===m; }); }
function byDate(arr,d){ return arr.filter(function(i){ return i.date===d; }); }

var toastT=null;
function toast(msg){
  var t=el("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("on"); },2200);
}

/* ================= state ================= */
var S = {
  tab:"dashboard",
  dashMonth: monthKey(),
  prodMonth: monthKey(),
  expMonth: monthKey(),
  customers: lsGet("customers",[]),
  workers: lsGet("workers",[]),
  production: lsGet("production",[]),
  deliveries: lsGet("deliveries",[]),
  payments: lsGet("payments",[]),
  expenses: lsGet("expenses",[]),
  attendance: lsGet("attendance",{})
};
var MODAL_CUSTOMER = null;

function persist(key){ lsSet(key, S[key]); }

/* ================= computed ================= */
function activeCustomers(){ return S.customers.filter(function(c){ return c.status!=="inactive"; }); }
function activeWorkers(){ return S.workers.filter(function(w){ return w.status!=="inactive"; }); }
function getCustomer(id){ return S.customers.find(function(c){ return c.id===id; }); }
function getWorker(id){ return S.workers.find(function(w){ return w.id===id; }); }
function deliveriesFor(id){ return S.deliveries.filter(function(d){ return d.customerId===id; }); }
function paymentsFor(id){ return S.payments.filter(function(p){ return p.customerId===id; }); }
function customerBilled(id){ return sumField(deliveriesFor(id),"amount"); }
function customerPaid(id){ return sumField(paymentsFor(id),"amount"); }
function customerOutstanding(id){ return customerBilled(id)-customerPaid(id); }
function totalOutstanding(){ return S.customers.reduce(function(t,c){ return t+Math.max(0,customerOutstanding(c.id)); },0); }

function todayDeliveries(){ return byDate(S.deliveries, todayKey()); }
function todayProduction(){ return sumField(byDate(S.production, todayKey()),"qty"); }
function todayDistributed(){ return sumField(todayDeliveries(),"qty"); }
function todayRevenue(){ return sumField(todayDeliveries(),"amount"); }
function todayExpenses(){ return sumField(byDate(S.expenses, todayKey()),"amount"); }
function todayProfit(){ return todayRevenue()-todayExpenses(); }

function monthProduction(m){ return sumField(inMonth(S.production,m),"qty"); }
function monthRevenue(m){ return sumField(inMonth(S.deliveries,m),"amount"); }
function monthExpenses(m){ return sumField(inMonth(S.expenses,m),"amount"); }
function monthProfit(m){ return monthRevenue(m)-monthExpenses(m); }

function attendanceToday(){
  var map = S.attendance[todayKey()]||{};
  var actives = activeWorkers();
  var present=0;
  actives.forEach(function(w){ if(map[w.id]==="present") present++; });
  return {present:present, total:actives.length};
}
function workerAttendanceMonth(workerId,m){
  var dates = Object.keys(S.attendance).filter(function(d){ return monthOf(d)===m && S.attendance[d][workerId]; });
  var present = dates.filter(function(d){ return S.attendance[d][workerId]==="present"; }).length;
  return {present:present, marked:dates.length};
}

/* ================= mutations ================= */
function upsertCustomer(data){
  if(data.id){ var i=S.customers.findIndex(function(c){ return c.id===data.id; }); if(i>=0) S.customers[i]=Object.assign({},S.customers[i],data); }
  else { data.id=uid(); S.customers.push(data); }
  persist("customers");
}
function deleteCustomer(id){
  S.customers=S.customers.filter(function(c){ return c.id!==id; });
  S.deliveries=S.deliveries.filter(function(d){ return d.customerId!==id; });
  S.payments=S.payments.filter(function(p){ return p.customerId!==id; });
  persist("customers"); persist("deliveries"); persist("payments");
}
function upsertWorker(data){
  if(data.id){ var i=S.workers.findIndex(function(w){ return w.id===data.id; }); if(i>=0) S.workers[i]=Object.assign({},S.workers[i],data); }
  else { data.id=uid(); S.workers.push(data); }
  persist("workers");
}
function deleteWorker(id){ S.workers=S.workers.filter(function(w){ return w.id!==id; }); persist("workers"); }

function upsertProduction(data){
  if(data.id){ var i=S.production.findIndex(function(p){ return p.id===data.id; }); if(i>=0) S.production[i]=Object.assign({},S.production[i],data); }
  else { data.id=uid(); S.production.push(data); }
  persist("production");
}
function deleteProduction(id){ S.production=S.production.filter(function(p){ return p.id!==id; }); persist("production"); }

function upsertExpense(data){
  if(data.id){ var i=S.expenses.findIndex(function(x){ return x.id===data.id; }); if(i>=0) S.expenses[i]=Object.assign({},S.expenses[i],data); }
  else { data.id=uid(); S.expenses.push(data); }
  persist("expenses");
}
function deleteExpense(id){ S.expenses=S.expenses.filter(function(x){ return x.id!==id; }); persist("expenses"); }

function deleteDelivery(id){ S.deliveries=S.deliveries.filter(function(d){ return d.id!==id; }); persist("deliveries"); }
function upsertDelivery(customerId,date,q,rate){
  var amt=Math.round(q*rate*100)/100;
  var i=S.deliveries.findIndex(function(d){ return d.customerId===customerId && d.date===date; });
  if(i>=0){ S.deliveries[i].qty=q; S.deliveries[i].rate=rate; S.deliveries[i].amount=amt; }
  else { S.deliveries.push({id:uid(),customerId:customerId,date:date,qty:q,rate:rate,amount:amt}); }
  persist("deliveries");
}
function bulkLogToday(){
  var today=todayKey(), changed=false;
  activeCustomers().forEach(function(c){
    var exists=S.deliveries.some(function(d){ return d.customerId===c.id && d.date===today; });
    if(!exists && (+c.defaultQty>0)){
      var amt=Math.round((+c.defaultQty)*(+c.rate)*100)/100;
      S.deliveries.push({id:uid(),customerId:c.id,date:today,qty:+c.defaultQty,rate:+c.rate,amount:amt});
      changed=true;
    }
  });
  if(changed){ persist("deliveries"); toast("Logged today's deliveries using defaults."); }
  else toast("Nothing to log — all customers already have today's entry.");
}
function deletePayment(id){ S.payments=S.payments.filter(function(p){ return p.id!==id; }); persist("payments"); }
function addPayment(customerId,date,amount,mode,note){
  S.payments.push({id:uid(),customerId:customerId,date:date,amount:+amount,mode:mode,note:note||""});
  persist("payments");
}
function setAttendance(date,workerId,status){
  if(!S.attendance[date]) S.attendance[date]={};
  if(S.attendance[date][workerId]===status) delete S.attendance[date][workerId];
  else S.attendance[date][workerId]=status;
  persist("attendance");
}

/* ================= modal ================= */
function openModal(title, bodyHtml){
  el("modal-title").textContent=title;
  el("modal-body").innerHTML=bodyHtml;
  el("modal-backdrop").classList.remove("hidden");
  document.body.style.overflow="hidden";
}
function closeModal(){
  el("modal-backdrop").classList.add("hidden");
  el("modal-body").innerHTML="";
  document.body.style.overflow="";

function openCustomerDetail(id){

  if(!c){ closeModal(); return; }
  MODAL_CUSTOMER=id;
  openModal(c.name, customerDetailHtml(id));
}

function statCard(label,value,cls){
  return '<div class="card '+(cls||"")+'"><div class="cv num">'+value+'</div><div class="cl">'+label+'</div></div>';
}

function dashboardHtml(){
  var m=S.dashMonth;
  var att=attendanceToday();
  var topOutstanding = S.customers.map(function(c){ return {c:c,out:customerOutstanding(c.id)}; })
    .filter(function(x){ return x.out>0.5; }).sort(function(a,b){ return b.out-a.out; }).slice(0,5);
  var expByCat = EXP_CATS.map(function(cat){
    return {cat:cat, total: sumField(inMonth(S.expenses,m).filter(function(x){ return x.category===cat.id; }),"amount")};
  }).filter(function(x){ return x.total>0; }).sort(function(a,b){ return b.total-a.total; });
  var maxExp = expByCat.length ? expByCat[0].total : 0;
  var profitToday = todayProfit(), profitMonth = monthProfit(m), pending = totalOutstanding();

  var html = '<section class="statgrid">' +
    statCard("Milk produced today", qty(todayProduction())) +
    statCard("Milk distributed today", qty(todayDistributed())) +
    statCard("Revenue today", money(todayRevenue())) +
    statCard("Expenses today", money(todayExpenses())) +
    statCard("Estimated profit today", money(profitToday), profitToday<0?"neg":"pos") +
    statCard("Active customers", activeCustomers().length) +
    statCard("Pending payments", money(pending), pending>0.5?"neg":"") +
    statCard("Workers present today", att.present+" / "+att.total) +
  '</section>';

  html += '<section class="monthnav">' +
    '<button class="iconbtn" data-action="dash-prev">‹</button>' +
    '<span class="monthname">'+monthLabel(m)+'</span>' +
    '<button class="iconbtn" data-action="dash-next"'+(m>=monthKey()?" disabled":"")+'>›</button>' +
  '</section>';

  html += '<section class="sec"><h2>This month</h2><div class="statgrid small">' +
    statCard("Production", qty(monthProduction(m))) +
    statCard("Revenue", money(monthRevenue(m))) +
    statCard("Expenses", money(monthExpenses(m))) +
    statCard("Profit / Loss", money(profitMonth), profitMonth<0?"neg":"pos") +
  '</div></section>';

  if(expByCat.length){
    html += '<section class="sec"><h2>Expenses by category</h2>' + expByCat.map(function(x){
      return '<div class="brow"><div class="n">'+x.cat.label+'</div><div class="v num">'+money(x.total)+'</div>' +
        '<div class="bar"><i style="width:'+Math.max(3,x.total/maxExp*100)+'%;background:'+catColor(x.cat.id)+'"></i></div></div>';
    }).join("") + '</section>';
  }

  if(topOutstanding.length){
    html += '<section class="sec"><h2>Payments pending</h2>' + topOutstanding.map(function(x){
      return '<div class="mini-row" data-action="open-customer" data-id="'+x.c.id+'">' +
        '<span>'+escapeHtml(x.c.name)+'</span><span class="v neg">'+money(x.out)+'</span></div>';
    }).join("") + '</section>';
  }

  html += '<section class="sec"><h2>Data &amp; backup</h2>' +
    '<p class="hint">All data is stored only on this device\'s browser. Export a backup regularly, or after any big change.</p>' +
    '<div class="form-actions">' +
      '<button class="btn ghost" data-action="export-backup">Export backup (JSON)</button>' +
      '<label class="btn ghost file-btn">Import backup<input type="file" id="import-file" accept="application/json" style="display:none"></label>' +
    '</div></section>';

  return html;
}

  var byD={}; entries.forEach(function(p){ (byD[p.date]=byD[p.date]||[]).push(p); });
  var dateKeys=Object.keys(byD).sort().reverse();

  var html = '<section class="monthnav">' +
    '<button class="iconbtn" data-action="prod-prev">‹</button>' +
    '<span class="monthname">'+monthLabel(m)+'</span>' +

  '</section>';
  html += '<div class="bigtotal"><div class="v num">'+qty(monthProduction(m))+'</div><div class="k">produced this month</div></div>';

  if(!dateKeys.length){
    html += '<p class="empty-inline">No production logged for '+monthLabel(m)+' yet. Tap + to add an entry.</p>';
  } else {
    dateKeys.forEach(function(dk){
      var items=byD[dk], dayTotal=sumField(items,"qty");

    return ai-bi || a.name.localeCompare(b.name);

function expensesHtml(){
  var m=S.expMonth;
  var entries=inMonth(S.expenses,m).slice().sort(function(a,b){ return b.date<a.date?-1:(b.date>a.date?1:0); });
  var byD={}; entries.forEach(function(x){ (byD[x.date]=byD[x.date]||[]).push(x); });
  var dateKeys=Object.keys(byD).sort().reverse();
  var byCat={}; entries.forEach(function(x){ byCat[x.category]=(byCat[x.category]||0)+(+x.amount||0); });
  var rows=Object.keys(byCat).map(function(k){
    var cat=EXP_CATS.find(function(c){ return c.id===k; })||{id:k,label:k};
    return {cat:cat,total:byCat[k]};
  }).sort(function(a,b){ return b.total-a.total; });
  var max=rows.length?rows[0].total:0;

  var html = '<section class="monthnav">' +
    '<button class="iconbtn" data-action="exp-prev">‹</button>' +
    '<span class="monthname">'+monthLabel(m)+'</span>' +
    '<button class="iconbtn" data-action="exp-next"'+(m>=monthKey()?" disabled":"")+'>›</button>' +
  '</section>';
  html += '<div class="bigtotal"><div class="v num">'+money(monthExpenses(m))+'</div><div class="k">spent this month</div></div>';

  if(rows.length){
    html += '<section class="sec">' + rows.map(function(r){
      return '<div class="brow"><div class="n">'+r.cat.label+'</div><div class="v num">'+money(r.total)+'</div>' +
        '<div class="bar"><i style="width:'+Math.max(3,r.total/max*100)+'%;background:'+catColor(r.cat.id)+'"></i></div></div>';
    }).join("") + '</section>';
  }

  if(!dateKeys.length){
    html += '<p class="empty-inline">No expenses logged for '+monthLabel(m)+' yet. Tap + to add one.</p>';
  } else {
    dateKeys.forEach(function(dk){
      var items=byD[dk], dayTotal=sumField(items,"amount");
      html += '<div class="daylbl">'+dateLabel(dk)+' · '+money(dayTotal)+'</div>';
      items.forEach(function(x){
        var cat=EXP_CATS.find(function(c){ return c.id===x.category; });
        html += '<div class="mini-row" data-action="edit-expense" data-id="'+x.id+'">' +
          '<span>'+(cat?cat.label:x.category)+(x.note?" · "+escapeHtml(x.note):"")+'</span>' +
          '<span class="v num">'+money(x.amount)+'</span></div>';
      });
    });
  }
  return html;
}

/* ================= render ================= */
function renderContent(){
  var c=el("content");
  if(S.tab==="dashboard") c.innerHTML=dashboardHtml();
  else if(S.tab==="production") c.innerHTML=productionHtml();
  else if(S.tab==="customers") c.innerHTML=customersHtml();
  else if(S.tab==="workers") c.innerHTML=workersHtml();
  else if(S.tab==="expenses") c.innerHTML=expensesHtml();
  c.scrollTop=0;
  renderFab();
}
function renderFab(){
  var show=["production","customers","workers","expenses"].indexOf(S.tab)>=0;
  el("fab-wrap").classList.toggle("hidden", !show);
}
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.tab===tab)); });
  renderContent();
}

/* ================= form submit handlers ================= */
function handleCustomerSubmit(form){
  var fd=new FormData(form);
  var data={ id: fd.get("id")||undefined, name:(fd.get("name")||"").trim(), mobile:(fd.get("mobile")||"").trim(),
    address:(fd.get("address")||"").trim(), milkType:fd.get("milkType"), status:fd.get("status"),
    defaultQty:+fd.get("defaultQty"), rate:+fd.get("rate") };
  if(!data.name) return;
  var wasEdit=!!data.id;
  upsertCustomer(data);
  renderContent();
  if(wasEdit && MODAL_CUSTOMER) openCustomerDetail(MODAL_CUSTOMER); else closeModal();
  toast("Customer saved.");
}
function handleWorkerSubmit(form){
  var fd=new FormData(form);
  var data={ id: fd.get("id")||undefined, name:(fd.get("name")||"").trim(), mobile:(fd.get("mobile")||"").trim(),

    salary:+fd.get("salary")||0, status:fd.get("status") };

}

  var fd=new FormData(form);
  var data={ id: fd.get("id")||undefined, date:fd.get("date"), shift:fd.get("shift"), qty:+fd.get("qty"),
    workerId: fd.get("workerId")||null, remarks:(fd.get("remarks")||"").trim() };
  if(!(data.qty>0)) return;
  upsertProduction(data); closeModal(); renderContent(); toast("Production entry saved.");
}
function handleExpenseSubmit(form){
  var fd=new FormData(form);
  var data={ id: fd.get("id")||undefined, date:fd.get("date"), category:fd.get("category"), amount:+fd.get("amount"),
    note:(fd.get("note")||"").trim() };
  if(!(data.amount>0)) return;
  upsertExpense(data); closeModal(); renderContent(); toast("Expense saved.");
}
function handleDeliverySubmit(form){
  var fd=new FormData(form);
  var id=fd.get("id"), customerId=fd.get("customerId"), date=fd.get("date"), q=+fd.get("qty"), rate=+fd.get("rate");
  if(!(q>0 && rate>=0)) return;
  if(id){
    var idx=S.deliveries.findIndex(function(d){ return d.id===id; });
    if(idx>=0){ S.deliveries[idx].date=date; S.deliveries[idx].qty=q; S.deliveries[idx].rate=rate; S.deliveries[idx].amount=Math.round(q*rate*100)/100; persist("deliveries"); }
  } else {
    upsertDelivery(customerId,date,q,rate);
  }
  renderContent();
  if(MODAL_CUSTOMER) openCustomerDetail(MODAL_CUSTOMER); else closeModal();
  toast("Delivery saved.");
}
function handlePaymentSubmit(form){
  var fd=new FormData(form);
  var amount=+fd.get("amount");
  if(!(amount>0)) return;
  addPayment(fd.get("customerId"), fd.get("date"), amount, fd.get("mode"), (fd.get("note")||"").trim());
  renderContent();
  if(MODAL_CUSTOMER) openCustomerDetail(MODAL_CUSTOMER); else closeModal();
  toast("Payment recorded.");
}

/* ================= backup ================= */
function exportBackup(){
  var payload={ exportedAt:new Date().toISOString(), customers:S.customers, workers:S.workers, production:S.production,
    deliveries:S.deliveries, payments:S.payments, expenses:S.expenses, attendance:S.attendance };
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="vardhan-dairy-backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  toast("Backup downloaded.");
}
function importBackup(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!confirm("Import will replace ALL current data on this device. Continue?")) return;
      S.customers=data.customers||[]; S.workers=data.workers||[]; S.production=data.production||[];
      S.deliveries=data.deliveries||[]; S.payments=data.payments||[]; S.expenses=data.expenses||[]; S.attendance=data.attendance||{};
      ["customers","workers","production","deliveries","payments","expenses","attendance"].forEach(persist);
      renderContent(); toast("Backup imported.");
    }catch(e){ toast("Invalid backup file."); }
  };
  reader.readAsText(file);
}

/* ================= events ================= */
document.addEventListener("click", function(e){
  var t=e.target.closest("[data-action]");
  if(!t) return;
  var action=t.dataset.action, id=t.dataset.id;

  switch(action){
    case "dash-prev": S.dashMonth=shiftMonth(S.dashMonth,-1); renderContent(); break;
    case "dash-next": if(S.dashMonth<monthKey()){ S.dashMonth=shiftMonth(S.dashMonth,1); renderContent(); } break;
    case "prod-prev": S.prodMonth=shiftMonth(S.prodMonth,-1); renderContent(); break;
    case "prod-next": if(S.prodMonth<monthKey()){ S.prodMonth=shiftMonth(S.prodMonth,1); renderContent(); } break;
    case "exp-prev": S.expMonth=shiftMonth(S.expMonth,-1); renderContent(); break;
    case "exp-next": if(S.expMonth<monthKey()){ S.expMonth=shiftMonth(S.expMonth,1); renderContent(); } break;

    case "add-customer": openModal("Add customer", customerFormHtml()); break;
    case "edit-customer": openModal("Edit customer", customerFormHtml(getCustomer(id))); break;
    case "delete-customer":
      if(confirm("Delete this customer and all their delivery/payment history? This cannot be undone.")){
        deleteCustomer(id); closeModal(); renderContent(); toast("Customer deleted.");
      }
      break;
    case "open-customer": openCustomerDetail(id); break;

    case "add-worker": openModal("Add worker", workerFormHtml()); break;
    case "edit-worker": openModal("Edit worker", workerFormHtml(getWorker(id))); break;
    case "delete-worker":
      if(confirm("Delete this worker?")){ deleteWorker(id); closeModal(); renderContent(); toast("Worker deleted."); }
      break;
    case "mark-present": setAttendance(todayKey(), id, "present"); renderContent(); break;
    case "mark-absent": setAttendance(todayKey(), id, "absent"); renderContent(); break;

    case "add-production": openModal("Log production", productionFormHtml()); break;
    case "edit-production": openModal("Edit production entry", productionFormHtml(S.production.find(function(p){ return p.id===id; }))); break;
    case "delete-production":
      if(confirm("Delete this production entry?")){ deleteProduction(id); closeModal(); renderContent(); toast("Entry deleted."); }
      break;

    case "add-expense": openModal("Add expense", expenseFormHtml()); break;
    case "edit-expense": openModal("Edit expense", expenseFormHtml(S.expenses.find(function(x){ return x.id===id; }))); break;
    case "delete-expense":
      if(confirm("Delete this expense?")){ deleteExpense(id); closeModal(); renderContent(); toast("Expense deleted."); }
      break;

    case "add-delivery": openModal("Log delivery", deliveryFormHtml(getCustomer(id))); break;
    case "edit-delivery":
      var d=S.deliveries.find(function(x){ return x.id===id; });
      if(d) openModal("Edit delivery", deliveryFormHtml(getCustomer(d.customerId), d));
      break;
    case "delete-delivery":
      if(confirm("Delete this delivery entry?")){
        deleteDelivery(id); renderContent();
        if(MODAL_CUSTOMER) openCustomerDetail(MODAL_CUSTOMER); else closeModal();
      }
      break;
    case "add-payment": openModal("Record payment", paymentFormHtml(getCustomer(id))); break;
    case "delete-payment":
      if(confirm("Delete this payment record?")){
        deletePayment(id); renderContent();
        if(MODAL_CUSTOMER) openCustomerDetail(MODAL_CUSTOMER);
      }
      break;

    case "bulk-log-today": bulkLogToday(); renderContent(); break;
    case "export-backup": exportBackup(); break;

    case "fab-add":
      if(S.tab==="production") openModal("Log production", productionFormHtml());
      else if(S.tab==="customers") openModal("Add customer", customerFormHtml());
      else if(S.tab==="workers") openModal("Add worker", workerFormHtml());
      else if(S.tab==="expenses") openModal("Add expense", expenseFormHtml());
      break;

    case "modal-close": closeModal(); break;
  }
});

document.addEventListener("submit", function(e){
  var form=e.target;
  var formId=form.getAttribute("id");
  if(!formId || formId.indexOf("form-")!==0) return;
  e.preventDefault();
  if(formId==="form-customer") handleCustomerSubmit(form);
  else if(formId==="form-worker") handleWorkerSubmit(form);
  else if(formId==="form-production") handleProductionSubmit(form);
  else if(formId==="form-expense") handleExpenseSubmit(form);
  else if(formId==="form-delivery") handleDeliverySubmit(form);
  else if(formId==="form-payment") handlePaymentSubmit(form);
});

document.addEventListener("change", function(e){
  if(e.target && e.target.id==="import-file"){
    var file=e.target.files[0];
    if(file) importBackup(file);
  }
});

el("modal-backdrop").addEventListener("click", function(e){
  if(e.target===this) closeModal();
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && !el("modal-backdrop").classList.contains("hidden")) closeModal();
});

document.querySelectorAll(".tab").forEach(function(btn){
  btn.addEventListener("click", function(){ switchTab(btn.dataset.tab); });
});

/* ================= init ================= */
el("today-pill").textContent=headerDateLabel();
renderContent();

})();
</script>
</body>
